<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>EBTL Admin</title>
    <script>
      (function () {
        function showBootError(message) {
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f2ec;color:#251d16;font-family:Inter,Arial,sans-serif"><div style="max-width:520px;background:#fffaf3;border:1px solid #e4d8c9;border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(95,67,36,.12)"><div style="font-weight:900;letter-spacing:.08em;margin-bottom:12px">EBTL</div><h1 style="margin:0 0 8px;font-size:24px">Admin app failed to load</h1><p style="color:#7c6d60;line-height:1.5">The server route is working, but the browser could not start the dashboard JavaScript.</p><pre style="white-space:pre-wrap;background:#ffe9e6;color:#9f2d22;border:1px solid #ffc7bf;padding:12px;border-radius:12px">' + String(message || 'Unknown browser error').replace(/[<>&]/g, function (c) { return ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[c]; }) + '</pre><button onclick="location.reload()" style="border:1px solid #2f6b4f;background:#2f6b4f;color:white;border-radius:12px;padding:10px 14px;font-weight:700">Reload</button></div></div>';
        }

        window.__EBTL_INDEX_INLINE_SCRIPT_RAN__ = true;
        fetch('/api/health?client_boot=inline', { cache: 'no-store' }).catch(function () {});

        window.addEventListener('error', function (event) {
          var message = event.message || (event.error && event.error.message) || 'Unknown script error';
          showBootError(message);
          fetch('/api/client-error', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: 'error', message: message, stack: event.error && event.error.stack, source: event.filename, line: event.lineno, column: event.colno, path: location.pathname })
          }).catch(function () {});
        });

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var message = reason && reason.message ? reason.message : String(reason || 'Unhandled promise rejection');
          showBootError(message);
          fetch('/api/client-error', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: 'unhandledrejection', message: message, stack: reason && reason.stack, path: location.pathname })
          }).catch(function () {});
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f2ec;color:#251d16;font-family:Inter,Arial,sans-serif">
        <div style="max-width:420px;background:#fffaf3;border:1px solid #e4d8c9;border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(95,67,36,.12)">
          <div style="font-weight:900;letter-spacing:.08em;margin-bottom:12px">EBTL</div>
          <h1 style="margin:0 0 8px;font-size:24px">Loading Admin Dashboard…</h1>
          <p style="color:#7c6d60;line-height:1.5">If this message stays on screen, the dashboard JavaScript did not start.</p>
        </div>
      </div>
    </div>
    <noscript>
      <div style="padding:24px;font-family:Arial,sans-serif">JavaScript is required to use the EBTL Admin Dashboard.</div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
