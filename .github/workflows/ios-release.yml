name: iOS release

# Builds a signed App Store IPA of the customer app and (optionally) ships it
# to TestFlight. Deliberately NOT wired to pull requests: macOS runners bill at
# 10x the Linux rate, and a full archive takes ~20 minutes. Run it by hand from
# the Actions tab, or push an `ios-v*` tag.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#
#   IOS_DIST_CERTIFICATE_P12_BASE64  Apple Distribution certificate + private key
#                                    exported from Keychain Access as .p12, then
#                                    `base64 -i cert.p12 | pbcopy`.
#   IOS_DIST_CERTIFICATE_PASSWORD    The password set during that .p12 export.
#   IOS_PROVISIONING_PROFILE_BASE64  App Store provisioning profile for
#                                    wtf.ebtl.app, with the Push Notifications
#                                    capability enabled, base64-encoded.
#   APP_STORE_CONNECT_API_KEY_ID     App Store Connect API key ID (e.g. ABC123DEF4).
#   APP_STORE_CONNECT_API_ISSUER_ID  Issuer ID (a UUID) from the same Keys page.
#   APP_STORE_CONNECT_API_KEY        Contents of the downloaded AuthKey_*.p8,
#                                    including the BEGIN/END lines.
#
# Optional:
#
#   IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64  base64 of GoogleService-Info.plist from
#                                         Firebase project ebtl-37ddb. Without it
#                                         the build still succeeds, but push,
#                                         Crashlytics, and Analytics stay off.
#
# Push notifications additionally need one thing that lives outside this repo:
# an APNs Authentication Key (.p8) uploaded to Firebase console → Project
# settings → Cloud Messaging → the iOS app, with its Key ID and the Apple team
# ID. Firebase talks to APNs on the app's behalf, and without that key it
# cannot, no matter how the app is signed.

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Version name override (e.g. 1.0.6). Defaults to pubspec.yaml."
        required: false
        type: string
      build_number:
        description: "Build number override. Must be higher than the last build uploaded for this version."
        required: false
        type: string
      api_base_url:
        description: "Backend base URL override (leave empty for production)."
        required: false
        type: string
      upload:
        description: "Upload the IPA to TestFlight when the build succeeds."
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "ios-v*"

# Releases must not cancel each other: a half-finished upload is worse than a
# duplicate run.
concurrency:
  group: ios-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build & upload IPA
    # Pinned rather than macos-latest: the release path depends on the Xcode
    # version (export methods, altool), so it should not move under us.
    #
    # macos-26, not macos-15: App Store Connect rejects anything built with an
    # SDK older than iOS 26 ("SDK version issue … must be built with the iOS 26
    # SDK or later"), and macos-15 still selects Xcode 16.4 / iOS 18.5 by
    # default. This image defaults to Xcode 26.6 / iOS 26.5.
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: customer-app
    env:
      # Not a secret — the team ID ships inside every signed IPA.
      APPLE_TEAM_ID: Z3MKKA37XR
      BUNDLE_ID: wtf.ebtl.app
      GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      # Fail in seconds with a readable list instead of 20 minutes in with a
      # codesigning error.
      - name: Check required secrets are set
        env:
          IOS_DIST_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_P12_BASE64 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          missing=()
          for name in IOS_DIST_CERTIFICATE_P12_BASE64 IOS_DIST_CERTIFICATE_PASSWORD \
                      IOS_PROVISIONING_PROFILE_BASE64 APP_STORE_CONNECT_API_KEY_ID \
                      APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. See the comment at the top of .github/workflows/ios-release.yml."
            exit 1
          fi
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::warning::IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 is not set — this build will ship without Firebase push, Crashlytics, or Analytics."
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Recorded because Apple validates the SDK the app was built against, and
      # a rejection at upload names an SDK version rather than an Xcode one.
      - name: Record toolchain versions
        run: |
          flutter --version
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - run: flutter pub get

      # Import the distribution certificate into a throwaway keychain rather
      # than the login keychain, so the cleanup step can delete it wholesale.
      - name: Install signing certificate
        env:
          IOS_DIST_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_P12_BASE64 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/ebtl-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          p12_path="$RUNNER_TEMP/dist.p12"

          echo "$IOS_DIST_CERTIFICATE_P12_BASE64" | base64 --decode > "$p12_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          # Keep the default keychains searchable; xcodebuild looks across the
          # whole user search list.
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          # No `-t`: it restricts the import to one item type, and `-t cert`
          # imports the certificate while silently dropping the private key,
          # leaving a keychain that holds no signing identity at all.
          security import "$p12_path" -k "$keychain_path" -P "$IOS_DIST_CERTIFICATE_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12_path"

          # Checked before set-key-partition-list, which fails with an opaque
          # "SecItemCopyMatching: The specified item could not be found in the
          # keychain" when there is no private key to attach a partition list
          # to. `find-identity` lists only complete cert+key pairs, so an empty
          # result here names the actual problem.
          identity="$(security find-identity -v -p codesigning "$keychain_path" | grep -o '"[^"]*"' | head -1 | tr -d '"' || true)"
          if [ -z "$identity" ]; then
            # An identity is a certificate plus its matching private key. Which
            # half is missing decides the fix, so report what actually landed
            # rather than guessing.
            certificates="$(security find-certificate -a -p "$keychain_path" 2> /dev/null | grep -c 'BEGIN CERTIFICATE' || true)"
            echo "Imported $certificates certificate(s); no complete signing identity."
            echo "Certificates in the keychain:"
            security find-certificate -a "$keychain_path" 2> /dev/null | grep '"labl"' || echo "  (none)"
            echo "Identities, including any macOS considers invalid:"
            security find-identity -p codesigning "$keychain_path" 2> /dev/null || true

            if [ "$certificates" -eq 0 ]; then
              echo "::error::The .p12 holds a private key but no certificate. Apple issues a .cer, never a .p12 — combine the .cer with the key you made the CSR from: openssl x509 -inform DER -in dist.cer -out cert.pem, then openssl pkcs12 -export -inkey key.pem -in cert.pem -out ios_distribution.p12"
            else
              echo "::error::The .p12 holds a certificate but no matching private key. Re-export it from the machine that generated the CSR, selecting the certificate together with the key nested under it."
            fi
            exit 1
          fi
          echo "Using signing identity: $identity"

          # Without this, codesign blocks on a GUI prompt for keychain access.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path" > /dev/null

          {
            echo "KEYCHAIN_PATH=$keychain_path"
            echo "KEYCHAIN_PASSWORD=$keychain_password"
            echo "CODE_SIGN_IDENTITY=$identity"
          } >> "$GITHUB_ENV"

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          profile_path="$RUNNER_TEMP/profile.mobileprovision"
          decoded="$RUNNER_TEMP/profile.plist"

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
          security cms -D -i "$profile_path" > "$decoded"

          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$decoded")"
          name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$decoded")"
          app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$decoded")"

          if [ "$app_id" != "$APPLE_TEAM_ID.$BUNDLE_ID" ]; then
            echo "::error::Provisioning profile is for '$app_id' but this app is '$APPLE_TEAM_ID.$BUNDLE_ID'."
            exit 1
          fi
          # The profile must grant production APNs: Release signs against
          # ios/Runner/RunnerRelease.entitlements, which asks for it, and
          # codesign fails when the profile does not allow what the
          # entitlements request.
          aps="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$decoded" 2> /dev/null || true)"
          if [ -z "$aps" ]; then
            echo "::warning::Provisioning profile has no aps-environment entitlement — enable Push Notifications on the App ID and regenerate it, or the archive will fail."
          elif [ "$aps" != "production" ]; then
            echo "::warning::Provisioning profile grants aps-environment '$aps', not 'production'. Use an App Store distribution profile, or push will not work in TestFlight."
          fi

          # Every other entitlement the Release build asks for has to be granted
          # by the profile too. Xcode only notices four minutes into the archive,
          # and names the capability without saying that the fix is in the
          # developer portal rather than the repo — so check it here instead.
          # aps-environment is handled above, where the value matters and not
          # just the key.
          # A plain string, not an array: this step runs under `set -u`, and the
          # bash 3.2 that macOS ships treats an empty array as unbound.
          missing=""
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            if [ "$key" != "aps-environment" ] \
              && ! /usr/libexec/PlistBuddy -c "Print :Entitlements:$key" "$decoded" > /dev/null 2>&1; then
              missing="$missing $key"
            fi
          done <<< "$(plutil -convert json -o - ios/Runner/RunnerRelease.entitlements | ruby -rjson -e 'puts JSON.parse(STDIN.read).keys')"

          if [ -n "$missing" ]; then
            echo "::error::Provisioning profile '$name' does not grant:$missing. These are requested by ios/Runner/RunnerRelease.entitlements, and the archive cannot be signed without them. Enable the matching capabilities on App ID $BUNDLE_ID at developer.apple.com → Certificates, Identifiers & Profiles → Identifiers, regenerate the App Store profile (editing an App ID invalidates its profiles), and update the IOS_PROVISIONING_PROFILE_BASE64 secret."
            exit 1
          fi

          # Xcode 16 reads profiles from UserData; older tooling reads the
          # legacy path. Install to both so either resolves the profile.
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile_path" "$dir/$uuid.mobileprovision"
          done

          echo "Installed provisioning profile: $name ($uuid)"
          echo "PROVISIONING_PROFILE_NAME=$name" >> "$GITHUB_ENV"

      # xcodeproj ships with the runner's CocoaPods install; only pay for a gem
      # install if that ever stops being true.
      - name: Ensure the xcodeproj gem is available
        run: ruby -e "require 'xcodeproj'" 2> /dev/null || sudo gem install xcodeproj --no-document

      - name: Add GoogleService-Info.plist
        if: env.GOOGLE_SERVICE_INFO_PLIST_BASE64 != ''
        run: |
          set -euo pipefail
          plist=ios/Runner/GoogleService-Info.plist
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > "$plist" 2> /dev/null || true

          # macOS base64 skips characters outside its alphabet instead of
          # failing, so a secret holding the plist itself decodes to garbage
          # and only surfaces later as an opaque CopyPlistFile error mid-archive.
          # Lint here, and accept the plist verbatim as well as base64 of it.
          if ! plutil -lint "$plist" > /dev/null 2>&1; then
            printf '%s\n' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" > "$plist"
            if plutil -lint "$plist" > /dev/null 2>&1; then
              echo "::notice::IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 held the plist verbatim rather than base64 of it; used as-is."
            else
              rm -f "$plist"
              echo "::error::IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 is neither base64 of GoogleService-Info.plist nor the plist itself. Re-encode the file Firebase gave you, bytes and all: [Convert]::ToBase64String([IO.File]::ReadAllBytes('GoogleService-Info.plist')) | Set-Clipboard"
              exit 1
            fi
          fi

          ruby ios/scripts/add_google_service_info.rb

      # Generates Flutter/Generated.xcconfig (version, dart-defines) and
      # resolves the plugin Swift package, without building anything yet — the
      # archive below drives the actual build.
      - name: Configure Xcode project
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          set -euo pipefail
          args=(--release --config-only --no-codesign)
          if [ -n "${BUILD_NAME:-}" ]; then args+=(--build-name="$BUILD_NAME"); fi
          if [ -n "${BUILD_NUMBER:-}" ]; then args+=(--build-number="$BUILD_NUMBER"); fi
          if [ -n "${API_BASE_URL:-}" ]; then args+=(--dart-define=API_BASE_URL="$API_BASE_URL"); fi
          flutter build ios "${args[@]}"

      # Onto the Runner target, not the xcodebuild command line: command-line
      # settings reach every Swift Package target too, and packages refuse a
      # manually specified provisioning profile. The edit lives in the CI
      # checkout only, so the committed project keeps automatic signing.
      - name: Apply signing settings to the Runner target
        run: ruby ios/scripts/set_signing.rb

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain=$KEYCHAIN_PATH"

      - name: Export IPA
        run: |
          set -euo pipefail
          # The heredoc body is indented to satisfy YAML; sed strips that back
          # off, because an XML declaration must start at byte 0.
          sed 's/^[[:space:]]*//' > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>$CODE_SIGN_IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROVISIONING_PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
            <!-- The build number comes from pubspec.yaml (or the workflow
                 input); Xcode must not invent its own. -->
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

          ipa="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -1)"
          if [ -z "$ipa" ]; then
            echo "::error::Export produced no .ipa."
            exit 1
          fi
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"

          # A build signed for the APNs sandbox uploads and installs happily,
          # then drops every push with BadDeviceToken — invisible until a
          # tester reports missing notifications. Read what actually got
          # signed rather than trusting the entitlements file.
          app="$(find "$RUNNER_TEMP/Runner.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)"
          signed_aps="$(codesign -d --entitlements :- "$app" 2> /dev/null \
            | plutil -extract aps-environment raw -o - - 2> /dev/null || true)"
          if [ "$signed_aps" != "production" ]; then
            echo "::error::Archive is signed with aps-environment '${signed_aps:-none}', not 'production'. Push notifications will not reach TestFlight builds. Check ios/Runner/RunnerRelease.entitlements and the provisioning profile."
            exit 1
          fi

          # Keep the dSYMs: without them TestFlight and Crashlytics crash
          # reports stay unsymbolicated, and the archive dies with the runner.
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Runner.xcarchive/dSYMs" "$RUNNER_TEMP/dSYMs.zip"

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: |
            ${{ env.IPA_PATH }}
            ${{ runner.temp }}/dSYMs.zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload to TestFlight
        if: ${{ github.event_name == 'push' || inputs.upload }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          # altool discovers the key by filename in this directory; there is no
          # flag to point at an arbitrary path.
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$key_dir/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          chmod 600 "$key_dir/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"

          xcrun altool --validate-app -f "$IPA_PATH" -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

          echo "Uploaded. Processing in App Store Connect usually takes 5-15 minutes before the build appears in TestFlight."

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2> /dev/null || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles" \
                 "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                 "$HOME/.appstoreconnect/private_keys" \
                 "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
