name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  admin-dashboard:
    name: admin-dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: admin-dashboard/.node-version
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json
      - run: npm ci
      # The client build (vite) is self-contained and needs no runtime secrets.
      - run: npm run build

  customer-app:
    name: customer-app analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
