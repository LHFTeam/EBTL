name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs: rapid pushes to the same PR (or branch) leave only
# the newest run alive instead of building every intermediate commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which app directories changed so the heavy build jobs only run when
  # they are actually affected. Jobs skipped via `if:` report a "skipped"
  # conclusion, which branch protection treats as passing for required checks.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      admin-dashboard: ${{ steps.filter.outputs.admin-dashboard }}
      customer-app: ${{ steps.filter.outputs.customer-app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            admin-dashboard:
              - 'admin-dashboard/**'
              - '.github/workflows/ci.yml'
            customer-app:
              - 'customer-app/**'
              - '.github/workflows/ci.yml'

  admin-dashboard:
    name: admin-dashboard build
    needs: changes
    if: ${{ needs.changes.outputs.admin-dashboard == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: admin-dashboard/.node-version
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json
      - run: npm ci
      # The client build (vite) is self-contained and needs no runtime secrets.
      - run: npm run build

  customer-app:
    name: customer-app analyze
    needs: changes
    if: ${{ needs.changes.outputs.customer-app == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze

  customer-app-android:
    name: customer-app android build
    needs: changes
    if: ${{ needs.changes.outputs.customer-app == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Verifies the real Android build (AGP 9, Stripe + Firebase native linking,
      # minSdk). GOOGLE_SERVICES_JSON_BASE64 is decoded into google-services.json
      # by android/app/build.gradle.kts to exercise the Firebase/google-services
      # path; if the secret is unset the app still builds with push disabled.
      - name: Build debug APK
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: flutter build apk --debug
