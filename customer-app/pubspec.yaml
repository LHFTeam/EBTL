name: ebtl_customer_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  google_fonts: ^8.1.0
  flutter_secure_storage: ^10.3.1
  flutter_markdown: ^0.7.7+1
  flutter_svg: ^2.3.0
  # Disk-backed image cache. Flutter's built-in ImageCache is memory-only and
  # empty on every cold start, so product/bottle art was re-downloaded on each
  # launch and whenever it got evicted under memory pressure.
  cached_network_image: ^3.4.1
  flutter_stripe: ^11.1.0
  # Microsoft Clarity session replay + heatmaps. Inert unless a project ID is
  # supplied at build time (see lib/services/clarity_service.dart).
  clarity_flutter: ^1.9.0
  # Push notifications (FCM). Inert unless Firebase config is present at build
  # time (see lib/services/push_notification_service.dart + android Gradle).
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  # Customer-app product analytics. Uses the same Firebase project as push and
  # Crashlytics and is disabled automatically in debug builds.
  firebase_analytics: ^12.4.5
  # Native Meta App Events for campaign attribution and conversion audiences.
  # Uses the same Meta Developer App that will support Facebook Login later.
  facebook_app_events: ^0.30.3
  # Crash + uncaught-error reporting. Inert unless Firebase config is present at
  # build time (see lib/services/crash_reporting_service.dart).
  firebase_crashlytics: ^5.0.4
  # Tells the Home hero carousel when it is off-screen so it stops
  # auto-rotating. Flutter's own TickerMode covers a covered route but not a
  # tab left mounted in RootShell's IndexedStack, and it does not gate the
  # plain Timer the carousel runs on either.
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/ingredients/
    - assets/profile/
    - assets/banners/
    - assets/images/filters/
    - assets/animations/ebtl_loader.webp
    - assets/images/onboarding/
    - assets/images/order_confirmation/
